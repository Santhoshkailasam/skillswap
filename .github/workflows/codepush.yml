name: CodePush Auto-Release & Live Sync

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Generate Version & Metadata
        id: vars
        run: |
          VERSION="1.1.$(date +'%Y%m%d%H%M')"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: 🚀 Publish Release to CodePush Server
        run: |
          node -e '
            const version = process.env.RELEASE_VERSION;
            const commitMsg = process.env.COMMIT_MSG || "App update";
            const apiKey = process.env.CODEPUSH_API_KEY;
            
            if (!apiKey) {
              console.error("❌ ERROR: CODEPUSH_API_KEY secret is not set in GitHub repository settings!");
              process.exit(1);
            }

            const payload = {
              platform: "android",
              projectId: "app_rCYp1a_mvdfs5j4_w9dyc",
              version: version,
              downloadUrl: `https://codepushs.netlify.app/bundles/android-v${version}.zip`,
              mandatory: true,
              releaseNotes: `Git Push: ${commitMsg}`
            };

            fetch("https://codepushs.netlify.app/.netlify/functions/publish-release", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-codepush-api-key": apiKey
              },
              body: JSON.stringify(payload)
            })
            .then(async (res) => {
              const data = await res.json();
              console.log("Server response status:", res.status);
              console.log("Server response body:", JSON.stringify(data, null, 2));
              if (!res.ok) {
                console.error("Failed to publish release:", data.error || res.statusText);
                process.exit(1);
              }
              console.log("✅ Release successfully published to CodePush!");
            })
            .catch((err) => {
              console.error("Request error:", err);
              process.exit(1);
            });
          '
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
          COMMIT_MSG: ${{ steps.vars.outputs.commit_msg }}
          CODEPUSH_API_KEY: ${{ secrets.CODEPUSH_API_KEY }}
